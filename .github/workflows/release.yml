---
name: Create release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip integration
        run: cd custom_components/bbox && zip -r ../../bbox.zip .
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}" bbox.zip
          --repo "${GITHUB_REPOSITORY}" --generate-notes
