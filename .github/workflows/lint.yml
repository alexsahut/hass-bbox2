---
name: Lint

on:
  push:
    branches: ["master"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Ruff lint
        run: uvx ruff@0.17.5 check .
      - name: Ruff format
        run: uvx ruff@0.17.5 format --check .
