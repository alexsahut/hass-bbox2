---
name: Tests

on:
  push:
    branches: ["master"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --python 3.14 --locked
      - name: Run tests
        run: uv run pytest -p no:cacheprovider
